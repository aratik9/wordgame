
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मराठी शब्दांचा खेळ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#e0e7ff,#fce7f3);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
}
.game {
  background: white;
  max-width: 420px;
  width: 100%;
  padding: 28px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 12px 40px #3730a322;
}
h1 { color: #5b21b6; }
.word {
  font-size: 38px;
  font-weight: bold;
  color: #7c3aed;
  margin: 24px 0;
  letter-spacing: 5px;
}
.options {
  display: grid;
  gap: 10px;
}
button {
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}
.option {
  background: #f3f0ff;
  color: #4c1d95;
}
.option:hover { background: #ddd6fe; }
#message { font-size: 18px; margin: 18px 0; }
.next { background: #6d28d9; color: white; width: 100%; }
</style>
</head>
<body>
<div class="game">
  <h1>🧠 मराठी शब्द गेम</h1>
  <p>अक्षरे योग्य क्रमाने लावून शब्द ओळखा!</p>
  <div id="progress">प्रश्न 1</div>
  <div class="word" id="word">ळा शा</div>
  <div class="options" id="options"></div>
  <p id="message">योग्य उत्तर निवडा.</p>
  <p>⭐ गुण: <b id="score">0</b></p>
  <button class="next" id="next" hidden>पुढचा प्रश्न →</button>
</div>

<script>
const questions = [
  { word:"ळा शा", answer:"शाळा",
    options:["शाळा","माळा","झाड","आकाश"] },
  { word:"का आ श", answer:"आकाश",
    options:["पाऊस","आकाश","समुद्र","डोंगर"] },
  { word:"ड झा", answer:"झाड",
    options:["फूल","पान","झाड","घर"] },
  { word:"ऊ स पा", answer:"पाऊस",
    options:["पाऊस","वारा","सूर्य","चंद्र"] },
  { word:"र घ", answer:"घर",
    options:["दार","घर","रस्ता","गाव"] }
];

let current = 0;
let score = 0;
let answered = false;

const wordEl = document.getElementById("word");
const optionsEl = document.getElementById("options");
const messageEl = document.getElementById("message");
const nextBtn = document.getElementById("next");

function showQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById("progress").textContent =
    `प्रश्न ${current + 1} / ${questions.length}`;
  wordEl.textContent = q.word;
  optionsEl.innerHTML = "";
  messageEl.textContent = "योग्य उत्तर निवडा.";
  nextBtn.hidden = true;

  q.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = option;
    btn.onclick = () => checkAnswer(option, btn);
    optionsEl.appendChild(btn);
  });
}

function checkAnswer(option, btn) {
  if (answered) return;
  answered = true;

  if (option === questions[current].answer) {
    score++;
    document.getElementById("score").textContent = score;
    messageEl.textContent = "🎉 बरोबर उत्तर! शाब्बास!";
    btn.style.background = "#bbf7d0";
  } else {
    messageEl.textContent =
      "😊 योग्य उत्तर: " + questions[current].answer;
  }

  nextBtn.hidden = false;
  nextBtn.textContent =
    current === questions.length - 1 ? "निकाल पाहा" : "पुढचा प्रश्न →";
}

nextBtn.onclick = () => {
  current++;
  if (current >= questions.length) {
    wordEl.textContent = "🏆";
    optionsEl.innerHTML = "";
    document.getElementById("progress").textContent = "गेम पूर्ण!";
    messageEl.textContent =
      `तुझे गुण: ${score} / ${questions.length}`;
    nextBtn.textContent = "पुन्हा खेळ";
    nextBtn.onclick = () => {
      current = 0;
      score = 0;
      document.getElementById("score").textContent = 0;
      nextBtn.onclick = advance;
      showQuestion();
    };
    return;
  }
  showQuestion();
};

function advance() {
  current++;
  if (current >= questions.length) current = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
